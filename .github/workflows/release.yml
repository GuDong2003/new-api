name: Publish GD release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag in the format YYMMDD-gd-N, for example 260813-gd-1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gd-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/gudong2003/new-api

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate tag format
        id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^[0-9]{6}-gd-[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$RELEASE_TAG'. Expected YYMMDD-gd-N, for example 260813-gd-1."
            exit 1
          fi

          date_part="${RELEASE_TAG%%-gd-*}"
          release_number="${RELEASE_TAG##*-}"
          year="20${date_part:0:2}"
          month="${date_part:2:2}"
          day="${date_part:4:2}"

          parsed_date="$(date -u -d "$year-$month-$day" '+%y%m%d' 2>/dev/null || true)"
          if [[ "$parsed_date" != "$date_part" ]]; then
            echo "::error::Invalid calendar date in release tag '$RELEASE_TAG'."
            exit 1
          fi

          if ((10#$release_number < 1)); then
            echo "::error::Release sequence must be a positive integer."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $RELEASE_TAG"

  verify:
    name: Verify release commit
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read

  build:
    name: Build Docker image (${{ matrix.arch }})
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1

      - name: Write build version
        run: printf '%s\n' "$RELEASE_TAG" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=gd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gd-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Write image summary
        run: |
          {
            echo "### Docker image (${{ matrix.arch }})"
            echo
            echo '${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}-${{ matrix.arch }}'
            echo
            echo 'Digest: `${{ steps.image.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: Publish multi-architecture image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        id: manifest
        env:
          IMAGE_NAME: ghcr.io/gudong2003/new-api
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$RELEASE_TAG" \
            "$IMAGE_NAME:$RELEASE_TAG-amd64" \
            "$IMAGE_NAME:$RELEASE_TAG-arm64"

          digest=""
          for attempt in {1..12}; do
            digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" 2>/dev/null | awk '/^Digest:/ {print $2; exit}')" || true
            if [[ -n "$digest" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE_NAME: ghcr.io/gudong2003/new-api
      IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
    steps:
      - name: Create release with generated notes
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ## Docker image

            ```text
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ```

            Multi-architecture image: `linux/amd64`, `linux/arm64`

            Immutable digest: `${{ env.IMAGE_DIGEST }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
